# PTMonitor CI — build, test, package (Windows), x64 + ARM64.
#
# Contract (mirrors the macOS original's workflow):
#   - gate: `dotnet build -c Release` + `PTMonitor.Cli --selftest` (exit 0 =
#     pass) + `dotnet test`
#   - packaging: scripts/build.ps1 — self-contained single-file PTMonitor.exe
#     for both win-x64 and win-arm64 (ARM64 is cross-compiled on the x64
#     runner; its packaged-CLI selftest is skipped because the binary cannot
#     execute there — the architecture-independent --selftest gate still runs)
#   - provenance: a `SHA256SUMS.txt` next to the two zips plus a GitHub build
#     provenance attestation, both produced by the release job from the
#     artifacts it downloaded — never from a workspace leftover.
#
# Three jobs in this file (the fourth lane, branch prereleases, lives in
# branch-release.yml):
#   gate     — build + --selftest + dotnet test. The ONLY job a pull request
#              runs: no packaging, no release, read-only token.
#   package  — both architectures via build.ps1 -SkipGates + SHA256SUMS.txt,
#              uploaded as workflow artifacts. Skipped on pull_request.
#   release  — download the artifacts, re-verify the sums, attest provenance,
#              then `gh release create` with both zips + SHA256SUMS.txt.
#              Tag pushes only.
#
# Events:
#   - merge to main      -> gate + package (artifacts only)
#   - push of a v* tag   -> gate + package + release
#   - pull request       -> gate only, so a fork PR runs the contract and can
#                           never reach a release step
#   - workflow_dispatch  -> manual dev build (artifacts, no release)
#
# Tags are the stable-release lane; pushes to other branches produce rolling
# prereleases from branch-release.yml and never pass through this file.
#
# Every action reference is pinned to a 40-character commit SHA with the
# human-readable release in a trailing comment: a major tag is mutable, a commit
# is not.
#
# Least privilege: `contents: read` for the whole workflow. Only `release`
# escalates, and only to `contents: write` plus the two attestation scopes. No
# job that compiles, tests or packages can write to the repository.
#
# The gate commands, `-SkipGates` packaging calls and artifact names below are
# duplicated in branch-release.yml on purpose (both lanes must gate identically):
# keep them in sync when adding a gate. `branch-release.yml` carries the mirror
# note.

name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The contract. Runs for every event, including pull requests from forks;
  # nothing here needs (or gets) repository write access.
  gate:
    name: Build, self-test, unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Self-test
        run: dotnet run --project src/PTMonitor.Cli -c Release --no-build -- --selftest

      - name: Unit tests
        run: dotnet test tests/PTMonitor.Core.Tests -c Release --no-build

  # Packaging only ever runs after `gate` passed (`-SkipGates` is legal because
  # of that dependency) and never for a pull request.
  package:
    name: Package, checksum
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
            "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $sha = "${env:GITHUB_SHA}".Substring(0, 7)
            "APP_VERSION=1.0.0-dev.$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # Gates ran in `gate`; each package step publishes one architecture.
      - name: Package x64
        shell: pwsh
        run: .\scripts\build.ps1 -Version $env:APP_VERSION -Rid win-x64 -SkipGates

      - name: Package ARM64
        shell: pwsh
        run: .\scripts\build.ps1 -Version $env:APP_VERSION -Rid win-arm64 -SkipGates

      # build.ps1 rewrites artifacts/SHA256SUMS.txt from every zip it can see,
      # so the second call above leaves one file listing both architectures.
      - name: Upload checksums and zips
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PTMonitor-release
          path: |
            artifacts/PTMonitor-*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload workflow artifact (x64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PTMonitor-win-x64
          path: publish/win-x64/PTMonitor.exe
          if-no-files-found: error

      - name: Upload workflow artifact (ARM64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PTMonitor-win-arm64
          path: publish/win-arm64/PTMonitor.exe
          if-no-files-found: error

  # The only job with repository write access. Releases are cut by pushing a
  # v* tag; merges to main and manual runs stop at `package`.
  release:
    name: Attest, publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the attestation is signed through OIDC
      attestations: write # store the provenance attestation
    steps:
      # A separate job has a separate workspace: the zips must travel through
      # the run's artifacts, not through a leftover directory.
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PTMonitor-release
          path: artifacts

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The sums published next to the zips must describe the bytes that
      # travelled through the artifacts, so they are recomputed here rather
      # than trusted from the packaging job. The same block exists in
      # branch-release.yml — keep the two identical.
      - name: Verify checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sums = @(Get-Content artifacts/SHA256SUMS.txt | Where-Object { $_.Trim() })
          if ($sums.Count -ne 2) {
            throw "SHA256SUMS.txt should list 2 zips, found $($sums.Count)"
          }
          foreach ($line in $sums) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw "malformed checksum line: $line" }
            $expected = $parts[0]
            $name = $parts[1]
            if ($expected -cnotmatch '^[0-9a-f]{64}$') {
              throw "checksum is not 64 lowercase hex chars: $name"
            }
            if (-not (Test-Path "artifacts/$name")) {
              throw "checksum names a missing zip: $name"
            }
            $actual = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "checksum mismatch for $name" }
            Write-Host "verified $name"
          }

      # Before anything is published: an unattested binary must never reach a
      # release. `subject-path` covers both zips, which is what `gh attestation
      # verify <zip>` checks against.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*.zip

      - name: Create GitHub Release (tag builds only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out, so gh has no git remote to infer the
          # repository from; it reads GH_REPO instead.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/PTMonitor-$env:APP_VERSION-win-x64.zip" `
            "artifacts/PTMonitor-$env:APP_VERSION-win-arm64.zip" `
            "artifacts/SHA256SUMS.txt" `
            --title "PTMonitor $env:APP_VERSION" `
            --notes "Self-contained builds for Windows x64 and ARM64. Download the zip for your machine's architecture, unzip, and run PTMonitor.exe — no .NET runtime install needed. Verify the download against SHA256SUMS.txt or with ``gh attestation verify``; see the README." `
            --generate-notes
