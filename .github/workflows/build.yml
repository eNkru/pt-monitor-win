# PTMonitor CI — build, test, package (Windows).
#
# Contract (mirrors the macOS original's workflow):
#   - gate: `dotnet test` + `PTMonitor.Cli --selftest` (exit 0 = pass)
#   - packaging: scripts/build.ps1 — self-contained single-file PTMonitor.exe
#
# Two lanes in one workflow:
#   - push of v* tag -> build + test + zip, plus a GitHub Release with the zip
#   - workflow_dispatch still allows a manual dev build (artifact, no release)

name: Build & Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases on tag push

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
            "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ZIP_NAME=PTMonitor-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $sha = "${env:GITHUB_SHA}".Substring(0, 7)
            "APP_VERSION=1.0.0-dev.$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ZIP_NAME=PTMonitor-$sha-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Self-test
        run: dotnet run --project src/PTMonitor.Cli -c Release --no-build -- --selftest

      - name: Unit tests
        run: dotnet test tests/PTMonitor.Core.Tests -c Release --no-build

      - name: Package
        shell: pwsh
        run: .\scripts\build.ps1 -Version $env:APP_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTMonitor-win-x64
          path: publish/win-x64/PTMonitor.exe
          if-no-files-found: error

      # Releases are cut by pushing a v* tag; a manual workflow_dispatch run
      # only produces the artifact above and skips this step.
      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "artifacts/$env:ZIP_NAME" `
            --title "PTMonitor $env:APP_VERSION" `
            --notes "Self-contained build. Download, unzip, and run PTMonitor.exe — no .NET runtime install needed." `
            --generate-notes
